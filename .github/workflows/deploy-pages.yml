name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Validate
        run: |
          npm test
          npm run lint
          node --test scripts/release-publisher.check.mjs

      - name: Build
        run: npm run build

      - name: Prepare static web bundle
        id: bundle
        run: node scripts/release-publisher.mjs prepare

      - name: Package static web bundle
        env:
          BUNDLE: ${{ steps.bundle.outputs.bundle }}
        run: |
          cd release/site
          zip -q -r "../$BUNDLE" .
          cd ../..
          node scripts/release-publisher.mjs checksum

      - name: Retain release candidate
        uses: actions/upload-artifact@v4
        with:
          name: static-web-bundle
          path: |
            release/*.zip
            release/*.sha256
          if-no-files-found: error

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  release:
    if: github.ref == 'refs/heads/main'
    needs: [build, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: static-web-bundle
          path: release
      - name: Publish verified static web bundle
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release-publisher.mjs publish
